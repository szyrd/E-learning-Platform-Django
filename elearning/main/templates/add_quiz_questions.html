{% extends 'base.html' %}
{% block content %}
    <div class="container">
        <h2>Add Questions to Quiz: {{ quiz.title }}</h2>
        <form method="POST" id="questions-form">
            {% csrf_token %}
            <div id="questions-container">
                <!-- Single Question Input Group -->
                <div class="question-group" id="question-1">
                    <h5>Question 1</h5>
                    <div class="form-group">
                        <label>Question Text</label>
                        <input type="text" name="question_text_1" class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label>Option A</label>
                            <input type="text" name="option_a_1" class="form-control" required>
                        </div>
                        <div class="col">
                            <label>Option B</label>
                            <input type="text" name="option_b_1" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label>Option C</label>
                            <input type="text" name="option_c_1" class="form-control" required>
                        </div>
                        <div class="col">
                            <label>Option D</label>
                            <input type="text" name="option_d_1" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Correct Option</label>
                        <select name="correct_option_1" class="form-control" required>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                    <hr>
                </div>
            </div>
            <!-- Add More Questions Button -->
            <button type="button" id="add-question-btn" class="btn btn-secondary">+ Add Another Question</button>
            <br><br>
            <button type="submit" class="btn btn-success">Save Questions</button>
        </form>
    </div>

    <script>
        let questionCount = 1;
        document.getElementById('add-question-btn').addEventListener('click', function () {
            questionCount++;
            const container = document.getElementById('questions-container');
            const newQuestion = document.createElement('div');
            newQuestion.classList.add('question-group');
            newQuestion.id = `question-${questionCount}`;
            newQuestion.innerHTML = `
            <h5>Question ${questionCount}</h5>
            <div class="form-group">
                <label>Question Text</label>
                <input type="text" name="question_text_${questionCount}" class="form-control" required>
            </div>
            <div class="row">
                <div class="col">
                    <label>Option A</label>
                    <input type="text" name="option_a_${questionCount}" class="form-control" required>
                </div>
                <div class="col">
                    <label>Option B</label>
                    <input type="text" name="option_b_${questionCount}" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Option C</label>
                    <input type="text" name="option_c_${questionCount}" class="form-control" required>
                </div>
                <div class="col">
                    <label>Option D</label>
                    <input type="text" name="option_d_${questionCount}" class="form-control" required>
                </div>
            </div>
            <div class="form-group">
                <label>Correct Option</label>
                <select name="correct_option_${questionCount}" class="form-control" required>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>
            <hr>
        `;
            container.appendChild(newQuestion);
        });
    </script>
{% endblock %}
