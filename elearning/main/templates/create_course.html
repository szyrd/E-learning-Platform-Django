{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0 text-center">Create Course</h4>
                </div>
                <div class="card-body">
                    <form method="POST" class="needs-validation" novalidate>
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label for="id_title">Title</label>
                            <input type="text" name="title" id="id_title" class="form-control" placeholder="Enter course title" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="id_description">Description</label>
                            <textarea name="description" id="id_description" class="form-control" rows="4" placeholder="Enter course description" required></textarea>
                        </div>
                        <div class="form-group mb-3">
                            <label for="id_price">Price</label>
                            <input type="number" name="price" id="id_price" class="form-control" placeholder="Enter course price (or 0 for free)" min="0" step="0.01" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="id_category">Category</label>
                            <input type="text" name="category" id="id_category" class="form-control" placeholder="Enter course category" required>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary w-50">Create Course</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
