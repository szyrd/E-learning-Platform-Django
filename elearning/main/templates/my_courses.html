{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">My Courses</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Title</th>
                <th>Price</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody>
            {% for course in courses %}
            <tr>
                <td>
                    <a href="{% url 'course_page' course.id %}" class="text-decoration-none">
                        {{ course.title }}
                    </a>
                </td>
                <td>{{ course.price }}</td>
                <td>{{ course.category }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
