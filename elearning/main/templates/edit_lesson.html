{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Lesson</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="lessonTitle" class="form-label">Lesson Title</label>
                    <input type="text" id="lessonTitle" name="title" class="form-control" value="{{ form.title.value }}" placeholder="Enter lesson title" required>
                </div>
                <div class="mb-3">
                    <label for="lessonContent" class="form-label">Lesson Content</label>
                    <textarea id="lessonContent" name="content" class="form-control" rows="5" placeholder="Enter lesson content" required>{{ form.content.value }}</textarea>
                </div>
                <div class="mb-3">
                    <label for="lessonVideoURL" class="form-label">Lesson Video URL</label>
                    <input type="url" id="lessonVideoURL" name="video_url" class="form-control" value="{{ form.video_url.value }}" placeholder="Enter video URL">
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{% url 'course_page' lesson.course.id %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
