{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-3">
        <ul class="list-group">
            <li class="list-group-item active">Instructor Dashboard</li>
            <li class="list-group-item">
                <a href="{% url 'my_courses' %}" class="text-decoration-none">My Courses</a>
            </li>
            <li class="list-group-item">
                <a href="{% url 'create_course' %}" class="text-decoration-none">Add Course</a>
            </li>
        </ul>
    </div>
    <div class="col-md-9">
        <h2 class="mb-4 text-center">Instructor Information</h2>
        <ul class="list-group">
            <li class="list-group-item"><strong>Username:</strong> {{ user.username }}</li>
            <li class="list-group-item"><strong>Email:</strong> {{ user.email }}</li>
        </ul>
    </div>
</div>
{% endblock %}
