{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Quiz</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="quizTitle" class="form-label">Quiz Title</label>
                    <input type="text" id="quizTitle" name="title" class="form-control" value="{{ form.title.value }}" placeholder="Enter quiz title" required>
                </div>
                <div class="mb-3">
                    <label for="quizMarks" class="form-label">Total Marks</label>
                    <input type="number" id="quizMarks" name="total_marks" class="form-control" value="{{ form.total_marks.value }}" placeholder="Enter total marks" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{% url 'course_page' quiz.course.id %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
