{# usage: {% include "includes/form_field.html" with field=form.title %} #}
<div class="mb-3 {% if field.field.widget.input_type == 'checkbox' %}form-check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    {{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<div class="text-danger small mt-1"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>{% endfor %}
</div>
