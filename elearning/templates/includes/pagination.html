{% load course_extras %}
{% if page.has_other_pages %}
<nav aria-label="Pagination" class="mt-4">
  <ul class="pagination justify-content-center">
    <li class="page-item {% if not page.has_previous %}disabled{% endif %}"><a class="page-link" href="{% if page.has_previous %}{% query_replace page=page.previous_page_number %}{% else %}#{% endif %}">‹</a></li>
    {% for n in page.paginator.get_elided_page_range %}
      {% if n == page.paginator.ELLIPSIS %}<li class="page-item disabled"><span class="page-link">…</span></li>
      {% else %}<li class="page-item {% if n == page.number %}active{% endif %}"><a class="page-link" href="{% query_replace page=n %}">{{ n }}</a></li>{% endif %}
    {% endfor %}
    <li class="page-item {% if not page.has_next %}disabled{% endif %}"><a class="page-link" href="{% if page.has_next %}{% query_replace page=page.next_page_number %}{% else %}#{% endif %}">›</a></li>
  </ul>
</nav>
{% endif %}
