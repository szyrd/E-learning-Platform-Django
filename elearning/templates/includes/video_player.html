<div class="video-frame">
  {% if kind == "iframe" %}
    <iframe src="{{ src }}" title="{{ title }}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  {% elif kind == "video" %}
    <video controls preload="metadata" src="{{ src }}"></video>
  {% else %}
    <div class="empty"><div class="text-center"><i class="bi bi-film display-4 d-block mb-2"></i>No video for this lesson</div></div>
  {% endif %}
</div>
