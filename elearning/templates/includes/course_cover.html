{# usage: {% include "includes/course_cover.html" with course=course %} #}
<div class="course-cover">
  {% if course.thumbnail %}
    <img src="{{ course.thumbnail.url }}" alt="{{ course.title }}" loading="lazy">
  {% else %}
    <div class="placeholder-art" style="background: linear-gradient(135deg, {{ course.cover_color }} 0%, #002761 100%);">
      <i class="bi {{ course.category.icon|default:'bi-journal-bookmark' }}"></i>
    </div>
  {% endif %}
  {% if show_chip and course.category %}<span class="chip">{{ course.category.name }}</span>{% endif %}
</div>
