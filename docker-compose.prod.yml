# Production-style override: gunicorn, no source mount, debug off.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  web:
    command: ["gunicorn", "elearning.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-"]
    environment:
      DJANGO_DEBUG: "0"
    volumes:
      - media_data:/app/media
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    ports: []
    restart: unless-stopped
